# RecordAuditTrails. Override with `-f my-values.yaml` (see deploy/README.md).

nameOverride: ""
fullnameOverride: ""

image:
  repository: part11/record-audit-trails
  tag: ""            # defaults to the chart appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

replicaCount: 2
revisionHistoryLimit: 5

service:
  type: ClusterIP
  port: 8080
  annotations: {}

# PostgreSQL. Either set these fields (the chart builds the connection string) or provide secret.existingSecret
# containing ConnectionStrings__AuditDb.
database:
  host: ""           # default: the postgres service of the same release (umbrella chart)
  port: 5432
  name: record_audit_trails
  username: audit_app
  password: ""       # dev only; production: secret.existingSecret
  sslMode: Prefer    # use VerifyFull with a CA in production

# How this service trusts AuthenticationCore tokens. issuer/audience must equal AuthenticationCore's settings.
authentication:
  baseUrl: ""        # default: the authentication-core service of the same release (umbrella chart)
  issuer: https://auth.local
  audience: authentication-core-api
  jwksRefreshInterval: "00:05:00"
  revocationPollInterval: "00:00:15"
  feedServiceKey: "" # dev only; production: secret.existingSecret (AuthenticationCore__Revocation__FeedServiceKey)

# Retention in years (21 CFR 11.10(e)): the audit trail is kept at least as long as the record. The signature service
# writes these record types, so set them to at least the longest signed record type.
retention:
  defaultYears: 7
  byRecordType:
    ClinicalTrial: 15
    BatchRecord: 10
    ElectronicSignature: 15
    SignerEnrollment: 15
    SecurityAlert: 15

swaggerEnabled: true

secret:
  # A Secret you manage yourself (see scripts/generate-secrets.sh). It must contain the keys listed in the chart README /
  # deploy/README.md. When empty, this chart creates a Secret from the values above (development convenience only).
  existingSecret: ""

# Extra non-sensitive configuration, as ENV_NAME: value (e.g. Logging__LogLevel__Default: Warning).
config: {}
extraEnv: []

migrations:
  # Apply database migrations in an init container before the service starts (safe with several replicas: EF Core
  # takes a database lock). Disable if migrations are applied by your own pipeline.
  enabled: true
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 256Mi }

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1654
  runAsGroup: 1654
  fsGroup: 1654
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

resources:
  requests: { cpu: 100m, memory: 192Mi }
  limits: { memory: 384Mi }

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75
podDisruptionBudget:
  enabled: true
  minAvailable: 1

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: audit.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

networkPolicy:
  enabled: false
  extraIngress: []

nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []

tests:
  image: busybox:1.37
